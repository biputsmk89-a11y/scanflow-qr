name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Unit Test
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prune Old Workflow Artifacts (Keep Storage Under 500MB)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Purging old artifacts to free 500MB quota..."
          gh api repos/${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts[].id' 2>/dev/null | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting artifact ID: $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            fi
          done

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ScanFlow-QR-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

