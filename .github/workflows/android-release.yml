name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.1.8)'
        required: true
        default: '1.1.9'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Determine Version Name
        id: version_step
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT
            echo "release_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "VERSION=${TAG_VERSION}" >> $GITHUB_ENV
          else
            INPUT_VER="${{ github.event.inputs.version_name }}"
            RESOLVED_VER="${INPUT_VER:-1.0.0}"
            echo "version=${RESOLVED_VER}" >> $GITHUB_OUTPUT
            echo "release_tag=v${RESOLVED_VER}" >> $GITHUB_OUTPUT
            echo "VERSION=${RESOLVED_VER}" >> $GITHUB_ENV
          fi

      - name: Configure Signing Credentials
        id: signing_config
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64_SECRET" ]; then
            echo "$KEYSTORE_BASE64_SECRET" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "Using provided SIGNING_KEYSTORE_BASE64 secret."
          else
            echo "::notice::Secret SIGNING_KEYSTORE_BASE64 not configured. Generating official release keystore on-the-fly..."
            keytool -genkeypair -v -keystore "${RUNNER_TEMP}/release.keystore" \
              -alias "${KEY_ALIAS_SECRET:-scanflow-release-key}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASS_SECRET:-ScanFlowRelease2026!}" \
              -keypass "${KEY_PASS_SECRET:-ScanFlowRelease2026!}" \
              -dname "CN=ScanFlow QR, OU=Mobile, O=ScanFlow, L=Jakarta, ST=DKI Jakarta, C=ID"
          fi
          
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASS_SECRET:-ScanFlowRelease2026!}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-scanflow-release-key}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASS_SECRET:-ScanFlowRelease2026!}" >> $GITHUB_ENV
          echo "Signing credentials successfully configured."

      - name: Clean Project Build
        run: ./gradlew clean --no-daemon

      - name: Run Release Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace --no-daemon

      - name: Run Release Lint
        run: ./gradlew lintRelease --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release Android App Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify and Rename Release Artifacts
        id: artifacts_step
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          
          if [ ! -f "$APK_SRC" ] || [ ! -s "$APK_SRC" ]; then
            echo "::error::Release APK was not generated or is 0 bytes!"
            exit 1
          fi
          
          if [ ! -f "$AAB_SRC" ] || [ ! -s "$AAB_SRC" ]; then
            echo "::error::Release AAB was not generated or is 0 bytes!"
            exit 1
          fi
          
          VER="${VERSION:-1.0.0}"
          APK_DEST="app/build/outputs/apk/release/ScanFlow-Qr-v${VER}-release.apk"
          AAB_DEST="app/build/outputs/bundle/release/ScanFlow-Qr-v${VER}-release.aab"
          
          cp "$APK_SRC" "$APK_DEST"
          cp "$AAB_SRC" "$AAB_DEST"
          
          echo "apk_path=${APK_DEST}" >> $GITHUB_OUTPUT
          echo "aab_path=${AAB_DEST}" >> $GITHUB_OUTPUT
          
          echo "=== Verified Artifacts ==="
          ls -lh "$APK_DEST"
          ls -lh "$AAB_DEST"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_step.outputs.release_tag }}
          name: ScanFlow QR v${{ steps.version_step.outputs.version }}
          files: |
            ${{ steps.artifacts_step.outputs.apk_path }}
            ${{ steps.artifacts_step.outputs.aab_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Prune Old Workflow Artifacts & Runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Purging old GitHub Actions artifacts to free 500MB storage quota ==="
          gh api repos/${{ github.repository }}/actions/artifacts --paginate --jq '.artifacts[].id' 2>/dev/null | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting artifact ID: $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            fi
          done

          echo "=== Purging old completed workflow runs ==="
          gh api repos/${{ github.repository }}/actions/runs --paginate --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' 2>/dev/null | head -n 30 | while read -r run_id; do
            if [ -n "$run_id" ]; then
              echo "Deleting old workflow run: $run_id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$run_id" || true
            fi
          done

      - name: Cleanup Keystore
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/release.keystore" ]; then
            rm -f "${RUNNER_TEMP}/release.keystore"
            echo "Temporary release keystore securely removed."
          fi
