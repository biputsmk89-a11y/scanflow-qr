name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Determine Version Name
        id: version_step
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT
            echo "release_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "VERSION=${TAG_VERSION}" >> $GITHUB_ENV
          else
            INPUT_VER="${{ github.event.inputs.version_name }}"
            RESOLVED_VER="${INPUT_VER:-1.0.0}"
            echo "version=${RESOLVED_VER}" >> $GITHUB_OUTPUT
            echo "release_tag=v${RESOLVED_VER}" >> $GITHUB_OUTPUT
            echo "VERSION=${RESOLVED_VER}" >> $GITHUB_ENV
          fi

      - name: Configure Signing Credentials
        id: signing_config
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64_SECRET" ]; then
            echo "::error::Missing secret SIGNING_KEYSTORE_BASE64! Please add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          
          echo "$KEYSTORE_BASE64_SECRET" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASS_SECRET:-ScanFlowRelease2026!}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-scanflow-release-key}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASS_SECRET:-ScanFlowRelease2026!}" >> $GITHUB_ENV
          echo "Signing credentials successfully configured."

      - name: Clean Project Build
        run: ./gradlew clean --no-daemon

      - name: Run Release Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace --no-daemon

      - name: Run Release Lint
        run: ./gradlew lintRelease --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release Android App Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify and Rename Release Artifacts
        id: artifacts_step
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          
          if [ ! -f "$APK_SRC" ] || [ ! -s "$APK_SRC" ]; then
            echo "::error::Release APK was not generated or is 0 bytes!"
            exit 1
          fi
          
          if [ ! -f "$AAB_SRC" ] || [ ! -s "$AAB_SRC" ]; then
            echo "::error::Release AAB was not generated or is 0 bytes!"
            exit 1
          fi
          
          VER="${VERSION:-1.0.0}"
          APK_DEST="app/build/outputs/apk/release/ScanFlow-Qr-v${VER}-release.apk"
          AAB_DEST="app/build/outputs/bundle/release/ScanFlow-Qr-v${VER}-release.aab"
          
          cp "$APK_SRC" "$APK_DEST"
          cp "$AAB_SRC" "$AAB_DEST"
          
          echo "apk_path=${APK_DEST}" >> $GITHUB_OUTPUT
          echo "aab_path=${AAB_DEST}" >> $GITHUB_OUTPUT
          
          echo "=== Verified Artifacts ==="
          ls -lh "$APK_DEST"
          ls -lh "$AAB_DEST"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-QR-APK
          path: ${{ steps.artifacts_step.outputs.apk_path }}
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanFlow-QR-AAB
          path: ${{ steps.artifacts_step.outputs.aab_path }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_step.outputs.release_tag }}
          name: ScanFlow QR v${{ steps.version_step.outputs.version }}
          files: |
            ${{ steps.artifacts_step.outputs.apk_path }}
            ${{ steps.artifacts_step.outputs.aab_path }}
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Cleanup Keystore
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/release.keystore" ]; then
            rm -f "${RUNNER_TEMP}/release.keystore"
            echo "Temporary release keystore securely removed."
          fi
